<div class="table-wrap">
  <table>
    <thead>
      <tr>
        @if (showCheckbox()) {
          <th class="col-check"><input type="checkbox" class="checkbox" /></th>
        }
        @for (col of columns(); track col.key) {
          <th [style.width]="col.width ?? 'auto'">{{ col.label }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of data(); track $index) {
        <tr>
          @if (showCheckbox()) {
            <td class="col-check"><input type="checkbox" class="checkbox" /></td>
          }
          @for (col of columns(); track col.key) {
            <td>{{ row[col.key] }}</td>
          }
        </tr>
      } @empty {
        <tr>
          <td [attr.colspan]="columns().length + (showCheckbox() ? 1 : 0)" class="empty-cell">
            暂无数据
          </td>
        </tr>
      }
    </tbody>
  </table>
  @if (footer()) {
    <div class="table-footer">{{ footer() }}</div>
  }
</div>
