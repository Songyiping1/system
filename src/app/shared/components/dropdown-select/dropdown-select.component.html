<div class="dropdown-select" (click)="toggle($event)">
  <span class="dropdown-select__text" [class.dropdown-select__text--placeholder]="!value()">{{ displayLabel }}</span>
  <svg class="dropdown-select__arrow" [class.dropdown-select__arrow--open]="isOpen()" width="16" height="16" viewBox="0 0 16 16" fill="none">
    <path d="M4 6l4 4 4-4" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>

@if (isOpen()) {
  <div class="dropdown-panel">
    @for (item of flattenOptions(); track item.option.value) {
      <div
        class="dropdown-panel__item"
        [class.dropdown-panel__item--selected]="item.option.value === value()"
        [style.padding-left.px]="16 + item.level * 24"
        (click)="select(item.option, $event)"
      >
        <span>{{ item.option.label }}</span>
        @if (item.option.badge) {
          <span class="dropdown-panel__badge">{{ item.option.badge }}</span>
        }
      </div>
    }
  </div>
}
