@if (visible()) {
  <div class="modal-overlay" (click)="onOverlayClick($event)">
    <div
      class="modal-container"
      [class.size-sm]="size() === 'sm'"
      [class.size-md]="size() === 'md'"
      [class.size-lg]="size() === 'lg'"
      [class.size-xl]="size() === 'xl'"
      [class.size-auto]="size() === 'auto'"
      [style.border-radius.px]="radius()"
    >
      <!-- Header -->
      @if (showHeader()) {
        <div class="modal-header">
          <div class="modal-header-left">
            @if (showBack()) {
              <span class="back-btn" (click)="onBack()">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <path d="M11 4L6 9L11 14" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            }
            <ng-content select="[headerIcon]" />
            <span class="modal-title">{{ title() }}</span>
          </div>
          @if (showClose()) {
            <span class="close-btn" (click)="onClose()">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M5 5L13 13M13 5L5 13" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
          }
        </div>
      }

      <!-- Body -->
      <div class="modal-body">
        <ng-content />
      </div>

      <!-- Footer -->
      @if (showFooter()) {
        <div class="modal-footer">
          <ng-content select="[footer]" />
          @if (!confirmOnly()) {
            <button class="btn-cancel" (click)="onCancel()">{{ cancelText() }}</button>
          }
          <button class="btn-confirm" (click)="onConfirm()">{{ confirmText() }}</button>
        </div>
      }
    </div>
  </div>
}
