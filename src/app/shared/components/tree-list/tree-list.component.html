<div class="tree-list">
  <ng-container *ngTemplateOutlet="nodeList; context: { $implicit: items(), level: 0 }" />
</div>

<ng-template #nodeList let-nodes let-level="level">
  @for (node of nodes; track node.id) {
    <div
      class="tree-item"
      [class.active]="activeId() === node.id"
      [style.padding-left.px]="8 + level * 20"
      (click)="onSelect(node)"
      (contextmenu)="onContextMenu(node, $event)"
    >
      @if (node.children?.length) {
        <span class="expand-icon" [class.expanded]="node.expanded" (click)="toggleExpand(node, $event)">›</span>
      }
      <span class="tree-label">{{ node.label }}</span>
      @if (node.count !== undefined) {
        <span class="tree-count">({{ node.count }})</span>
      }
      @if (node.type === 'group') {
        <span class="tree-add" (click)="onAddAction(node, $event)" title="新增角色">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M6 1.5V10.5M1.5 6H10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
      }
    </div>
    @if (node.expanded && node.children?.length) {
      <ng-container *ngTemplateOutlet="nodeList; context: { $implicit: node.children, level: level + 1 }" />
    }
  }
</ng-template>
