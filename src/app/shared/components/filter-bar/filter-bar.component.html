<div class="filter-bar">
  @for (filter of filters(); track filter.key) {
    <div class="filter-bar__item">
      @if (filter.type === 'input') {
        <span class="filter-bar__label">{{ filter.label }}:</span>
        <input
          class="filter-bar__input"
          type="text"
          [value]="filter.value"
          (input)="onInputChange(filter, $event)"
        />
      } @else {
        <div class="filter-bar__select" (click)="toggleDropdown(filter.key)">
          <span class="filter-bar__label">{{ filter.label }}:</span>
          <span class="filter-bar__value">{{ filter.value || '全部' }}</span>
          <svg class="filter-bar__chevron" width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M3 4.5l3 3 3-3" stroke="#999" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        @if (openDropdownKey() === filter.key && filter.options) {
          <div class="filter-bar__dropdown">
            @for (option of filter.options; track option.value) {
              <div
                class="filter-bar__option"
                [class.filter-bar__option--active]="option.value === filter.value"
                (click)="selectOption(filter, option.value)"
              >{{ option.label }}</div>
            }
          </div>
        }
      }
    </div>
  }
</div>
