@if (visible()) {
  <div class="drawer-overlay" (click)="close()"></div>
  <div class="drawer" [style.width]="width()">
    <div class="drawer__header">
      <button class="drawer__close" (click)="close()">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
          <rect x="0.5" y="0.5" width="16" height="16" rx="4" stroke="#999"/>
          <path d="M6 8.5h5" stroke="#999" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="drawer__title">{{ title() }}</div>

    <div class="drawer__body">
      <ng-content />
    </div>

    <ng-content select="[drawerFooter]" />
  </div>
}
