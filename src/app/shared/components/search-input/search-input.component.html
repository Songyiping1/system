<div class="search-input">
  <svg class="search-input__icon" width="12" height="12" viewBox="0 0 12 12" fill="none">
    <circle cx="5" cy="5" r="4" stroke="#999" stroke-width="1.2"/>
    <path d="M8 8l3 3" stroke="#999" stroke-width="1.2" stroke-linecap="round"/>
  </svg>
  <input
    class="search-input__field"
    type="text"
    [placeholder]="placeholder()"
    [value]="value()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
  />
</div>
