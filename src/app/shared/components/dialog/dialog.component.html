@if (visible()) {
  <div class="dialog-overlay" (click)="onOverlayClick($event)">
    <div class="dialog" [style.width]="width()">
      <!-- Header -->
      <div class="dialog__header" [class.dialog__header--bordered]="headerBorder()">
        <div class="dialog__header-left">
          @if (showBack()) {
            <span class="dialog__back" (click)="onBack()">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M9 3L5 7l4 4" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          }
          <div class="dialog__title-group">
            <span class="dialog__title">{{ title() }}</span>
            @if (description()) {
              <span class="dialog__description">{{ description() }}</span>
            }
          </div>
        </div>
        @if (showClose()) {
          <span class="dialog__close" (click)="onClose()">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M5 5l8 8M13 5l-8 8" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
        }
      </div>

      <!-- Body -->
      <div class="dialog__body">
        <ng-content />
      </div>

      <!-- Footer (content projected) -->
      <div class="dialog__footer" [class.dialog__footer--bordered]="footerBorder()">
        <ng-content select="[dialogFooter]" />
      </div>
    </div>
  </div>
}
