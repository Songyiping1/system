<span
  class="type-badge"
  [class.type-badge--primary]="variant() === 'primary'"
  [class.type-badge--success]="variant() === 'success'"
  [class.type-badge--danger]="variant() === 'danger'"
  [class.type-badge--warning]="variant() === 'warning'"
  [class.type-badge--default]="variant() === 'default'"
>{{ label() }}</span>
