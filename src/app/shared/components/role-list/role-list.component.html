<div class="role-list">
  <div class="role-list__header">
    <app-search-input [placeholder]="'搜索角色'" (search)="onSearch($event)" (valueChange)="onSearch($event)" />
    <button class="role-list__add-btn" type="button">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="role-list__body">
    @for (group of groups(); track group.title) {
      <div class="role-list__group">
        <div class="role-list__group-header" (click)="toggleGroup(group)">
          <svg
            class="role-list__chevron"
            [class.role-list__chevron--expanded]="isGroupExpanded(group)"
            width="12" height="12" viewBox="0 0 12 12" fill="none"
          >
            <path d="M4.5 3l3 3-3 3" stroke="#999" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="role-list__group-title">{{ group.title }}</span>
        </div>

        @if (isGroupExpanded(group)) {
          <div class="role-list__items">
            @for (role of group.roles; track role.key) {
              <div
                class="role-list__item"
                [class.role-list__item--selected]="isSelected(role.key)"
                (click)="toggleSelect(role)"
              >
                <svg class="role-list__item-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.2"/>
                  <path d="M5 5h6M5 8h6M5 11h4" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                </svg>
                <span class="role-list__item-label">{{ role.label }}</span>
                @if (role.badge) {
                  <span class="role-list__item-badge">{{ role.badge }}</span>
                }
                @if (isSelected(role.key)) {
                  <svg class="role-list__check" width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <path d="M3 7l3 3 5-6" stroke="var(--color-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                }
              </div>
            }
          </div>
        }
      </div>
    }
  </div>
</div>
