<div class="top-tab-bar">
  <div class="tabs-area">
    @for (tab of tabs(); track tab.id) {
      <div class="tab-item" [class.active]="false">
        <span class="tab-label">{{ tab.label }}</span>
        @if (tab.closable) {
          <span class="tab-close">&times;</span>
        }
      </div>
    }
    <div class="tab-item active">
      <span class="tab-label">{{ activeNavLabel() }}</span>
      <span class="tab-close">&times;</span>
    </div>
  </div>

  <div class="toolbar">
    <div class="notification">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 01-3.46 0"/>
      </svg>
      <span class="badge">2</span>
    </div>

    <div class="user-avatar-wrap">
      <div class="avatar-dot" (click)="toggleUserMenu()">
        <span>{{ user()?.name?.charAt(0) }}</span>
      </div>

      <!-- 用户下拉菜单 -->
      @if (showUserMenu()) {
        <div class="user-menu">
          <div class="user-menu-header">
            <div class="menu-avatar">{{ user()?.name?.charAt(0) }}</div>
            <div class="menu-user-info">
              <span class="menu-user-name">{{ user()?.name }}</span>
              <span class="menu-user-company">中企云链（北京）信息科技有限公司</span>
            </div>
          </div>
          <div class="user-menu-section">
            <div class="user-menu-item" (click)="onChangePassword()">修改密码</div>
            <div class="user-menu-item" (click)="onChangeBinding()">修改绑定</div>
          </div>
          <div class="user-menu-section">
            <div class="user-menu-item">
              <span>切换账号</span>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M5 3L9 7L5 11" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="user-menu-item" (click)="onLogout()">退出登录</div>
          </div>
        </div>
      }
    </div>
  </div>
</div>

<!-- 修改密码弹窗 -->
<app-change-password-modal
  [visible]="showChangePwd()"
  (closed)="showChangePwd.set(false)"
/>

<!-- 修改绑定弹窗 -->
<app-change-binding-modal
  [visible]="showChangeBinding()"
  (closed)="showChangeBinding.set(false)"
/>
