<div class="top-tab-bar">
  <div class="top-tab-bar__tabs">
    @for (tab of tabs(); track tab.key) {
      <div class="top-tab-bar__tab" [class.top-tab-bar__tab--active]="tab.key === activeKey()" (click)="activeKeyChange.emit(tab.key)">
        <span class="top-tab-bar__tab-label">{{ tab.label }}</span>
        @if (tab.closable) {
          <span class="top-tab-bar__tab-close" (click)="onClose($event, tab.key)">
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M4 4l6 6M10 4l-6 6" stroke="currentColor" stroke-width="1.2"/></svg>
          </span>
        }
      </div>
    }
  </div>
  <div class="top-tab-bar__tools">
    <div class="top-tab-bar__notification">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9ZM13.73 21a2 2 0 0 1-3.46 0" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      @if (notificationCount() > 0) {
        <span class="top-tab-bar__badge">{{ notificationCount() }}</span>
      }
    </div>
    <div class="top-tab-bar__avatars">
      <span class="top-tab-bar__avatar"></span>
      <span class="top-tab-bar__avatar"></span>
      <span class="top-tab-bar__avatar"></span>
    </div>
  </div>
</div>
