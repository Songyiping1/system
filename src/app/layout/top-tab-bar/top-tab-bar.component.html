<div class="top-tab-bar">
  <div class="top-tab-bar__tabs">
    @for (tab of tabs(); track tab.key) {
      <div class="top-tab-bar__tab" [class.top-tab-bar__tab--active]="tab.key === activeKey()" (click)="activeKeyChange.emit(tab.key)">
        <span class="top-tab-bar__tab-label">{{ tab.label }}</span>
        @if (tab.closable) {
          <span class="top-tab-bar__tab-close" (click)="onClose($event, tab.key)">
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M4 4l6 6M10 4l-6 6" stroke="currentColor" stroke-width="1.2"/></svg>
          </span>
        }
      </div>
    }
  </div>
  <div class="top-tab-bar__tools">
    <div class="top-tab-bar__notification">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9ZM13.73 21a2 2 0 0 1-3.46 0" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      @if (notificationCount() > 0) {
        <span class="top-tab-bar__badge">{{ notificationCount() }}</span>
      }
    </div>
    <div class="top-tab-bar__avatar-wrap" (click)="toggleDropdown($event)">
      <app-avatar [name]="'张竞元'" [size]="32" [online]="true" />

      @if (showDropdown()) {
        <div class="user-dropdown" (click)="$event.stopPropagation()">
          <div class="user-dropdown__header">
            <app-avatar [name]="'张竞元'" [size]="44" />
            <div class="user-dropdown__info">
              <span class="user-dropdown__name">张竞元</span>
              <span class="user-dropdown__company">中企云链（北京）信息科技有限公司</span>
            </div>
          </div>
          <div class="user-dropdown__section">
            <div class="user-dropdown__item" (click)="onMenuClick('change-password')">修改密码</div>
            <div class="user-dropdown__item" (click)="onMenuClick('change-binding')">修改绑定</div>
          </div>
          <div class="user-dropdown__section user-dropdown__section--bordered">
            <div class="user-dropdown__item user-dropdown__item--arrow" (click)="onMenuClick('switch-account')">
              <span>切换账号</span>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M5 3l4 4-4 4" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="user-dropdown__item" (click)="onMenuClick('logout')">退出登录</div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
