<div class="page">
  <app-page-header title="成员权限变更" desc="查看企业全部成员权限变更的日志，追踪权限变更记录" [showHelp]="true" />
  <app-action-bar>
    <ng-container left>
      <app-filter-select label="部门" [options]="['全部', '开发部', '产品部', '运营部']" />
      <app-filter-select label="权限变更对象" [options]="['王凡玄', '郑婷雅', '冯云', '周健']" />
      <app-filter-select label="操作人" [options]="['全部', '赵莫艳', '周健']" />
      <app-filter-select label="时间" [options]="['2025-11-01 ~ 2025-11-06', '最近7天', '最近30天']" />
    </ng-container>
  </app-action-bar>
  @if (isLoading()) {
    <div class="state-loading">加载中...</div>
  } @else {
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>权限变更对象</th>
            <th>操作人</th>
            <th>部门</th>
            <th>事件类型</th>
            <th>事件描述</th>
            <th>创建时间</th>
          </tr>
        </thead>
        <tbody>
          @for (row of changeList(); track row.time) {
            <tr>
              <td>
                <div class="cell-user">
                  <div class="avatar">{{ row.targetAvatar }}</div>
                  <span>{{ row.target }}</span>
                </div>
              </td>
              <td>
                <div class="cell-user">
                  <div class="avatar">{{ row.operatorAvatar }}</div>
                  <span>{{ row.operator }}</span>
                </div>
              </td>
              <td>{{ row.dept }}</td>
              <td>{{ row.eventType }}</td>
              <td class="text-muted">{{ row.eventDesc }}</td>
              <td class="text-muted">{{ row.time }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
