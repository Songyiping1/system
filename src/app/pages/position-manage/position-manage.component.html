<div class="page">
  <app-page-header title="岗位管理" desc="岗位管理将部门组织化为具体职责，实现从静态编制构造到动态人事的关键桥梁。" [showHelp]="true" />
  <app-split-layout>
    <ng-container left>
      <app-search-input placeholder="搜索" [fullWidth]="true" />
      <app-tree-list [items]="treeItems()" [activeId]="activeTreeId()" (select)="onTreeSelect($event)" />
    </ng-container>
    <ng-container right>
      <app-action-bar>
        <ng-container left>
          <app-search-input placeholder="请输入姓名、工号、手机号" (search)="onSearch($event)" />
          <app-button label="筛选" type="outline" />
        </ng-container>
      </app-action-bar>
      @if (isLoading()) {
        <div class="state-loading">加载中...</div>
      } @else {
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>姓名</th>
                <th>工号</th>
                <th>邮箱</th>
                <th>手机号</th>
              </tr>
            </thead>
            <tbody>
              @for (row of members(); track row.jobNo) {
                <tr>
                  <td>
                    <div class="cell-user">
                      <div class="avatar">{{ row.avatar }}</div>
                      <span>{{ row.name }}</span>
                    </div>
                  </td>
                  <td>{{ row.jobNo }}</td>
                  <td>{{ row.email }}</td>
                  <td>{{ row.phone }}</td>
                </tr>
              }
            </tbody>
          </table>
          <div class="table-footer">UI设计师_普通员工&nbsp;&nbsp;总人数 30</div>
        </div>
      }
    </ng-container>
  </app-split-layout>
</div>
