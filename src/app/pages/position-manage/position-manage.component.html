<div class="page">
  <app-page-header title="岗位管理" desc="岗位管理将部门组织化为具体职责，实现从静态编制构造到动态人事的关键桥梁。" [showHelp]="true" />
  <app-split-layout>
    <ng-container left>
      <div class="left-header">
        <app-search-input placeholder="搜索" [fullWidth]="true" />
        <button class="add-btn" (click)="onAddPosition()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 2V12M2 7H12" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <app-tree-list
        [items]="treeItems()"
        [activeId]="activeTreeId()"
        (select)="onTreeSelect($event)"
        (contextMenu)="onTreeContextMenu($event)"
      />
    </ng-container>
    <ng-container right>
      <app-action-bar>
        <ng-container left>
          <app-search-input placeholder="请输入姓名、工号、手机号等" (search)="onSearch($event)" />
          <app-button label="筛选" type="outline" />
        </ng-container>
      </app-action-bar>
      @if (isLoading()) {
        <div class="state-loading">加载中...</div>
      } @else {
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>姓名</th>
                <th>工号</th>
                <th>邮箱</th>
                <th>手机号</th>
              </tr>
            </thead>
            <tbody>
              @for (row of filteredMembers(); track row.id) {
                <tr>
                  <td>
                    <div class="cell-user">
                      <div class="avatar">{{ row.avatar }}</div>
                      <span>{{ row.name }}</span>
                    </div>
                  </td>
                  <td>{{ row.jobNo }}</td>
                  <td>{{ row.email }}</td>
                  <td>{{ row.phone }}</td>
                </tr>
              }
            </tbody>
          </table>
          <div class="table-footer">{{ activePositionName() }}&nbsp;&nbsp;总人数 {{ totalCount() }}</div>
        </div>
      }
    </ng-container>
  </app-split-layout>
</div>

<!-- 右键菜单 -->
@if (contextMenuPos()) {
  <div class="context-menu" [style.left.px]="contextMenuPos()!.x" [style.top.px]="contextMenuPos()!.y" (click)="$event.stopPropagation()">
    <div class="context-menu-item" (click)="onEditPosition()">编辑岗位</div>
    <div class="context-menu-item danger" (click)="onDeletePosition()">删除岗位</div>
  </div>
}

<!-- 新建/编辑岗位弹窗 -->
<app-modal
  [title]="positionModalTitle()"
  size="sm"
  [visible]="showPositionModal()"
  (closed)="showPositionModal.set(false)"
  (confirmed)="onPositionModalConfirm()"
>
  <div class="modal-form">
    <label class="modal-form-label">岗位名称</label>
    <input
      class="modal-form-input"
      type="text"
      placeholder="请输入岗位名称"
      [value]="positionFormName()"
      (input)="positionFormName.set($any($event.target).value)"
    />
  </div>
</app-modal>

<!-- 删除确认弹窗 -->
<app-modal
  title="删除确认"
  size="sm"
  [visible]="showDeleteModal()"
  confirmText="确认删除"
  (closed)="showDeleteModal.set(false)"
  (confirmed)="onDeleteConfirmed()"
>
  <p>确定要删除该岗位吗？删除后将无法恢复。</p>
</app-modal>
