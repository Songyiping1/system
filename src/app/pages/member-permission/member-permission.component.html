<div class="page">
  <app-page-header title="成员管理权限审计" desc="查看全部成员拥有的管理员权限" [showHelp]="true" />
  <app-action-bar>
    <ng-container left>
      <app-search-input placeholder="搜索" (search)="onSearch($event)" />
      <app-filter-select label="部门" [options]="['开发部', '产品部', '运营部', '全部']" />
      <app-filter-select label="管理范围" [options]="['全公司', '所在部门', '所在部门及下级']" />
      <app-filter-select label="权限点" [options]="['全部', '成员管理', '角色管理', '审批管理']" />
    </ng-container>
  </app-action-bar>
  @if (isLoading()) {
    <div class="state-loading">加载中...</div>
  } @else {
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>管理员</th>
            <th>部门</th>
            <th>工号</th>
            <th>管理范围</th>
            <th>添加者</th>
            <th>操作时间</th>
          </tr>
        </thead>
        <tbody>
          @for (row of permissionList(); track row.jobNo) {
            <tr>
              <td>
                <div class="cell-user">
                  <div class="avatar">{{ row.adminAvatar }}</div>
                  <div class="user-info">
                    <span class="user-name">{{ row.admin }}</span>
                    <app-type-badge [label]="row.adminBadge" />
                  </div>
                </div>
              </td>
              <td>{{ row.dept }}</td>
              <td>{{ row.jobNo }}</td>
              <td>{{ row.scope }}</td>
              <td>
                <div class="cell-user">
                  <div class="avatar avatar-sm">{{ row.addedByAvatar }}</div>
                  <span>{{ row.addedBy }}</span>
                </div>
              </td>
              <td class="text-muted">{{ row.time }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
