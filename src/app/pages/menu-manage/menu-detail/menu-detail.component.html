<app-drawer [visible]="visible()" title="菜单详情" (visibleChange)="visibleChange.emit($event)" (closed)="close()">
  <div class="detail-section">
    <h3 class="detail-section__title">基础信息</h3>
    <app-form-field label="菜单名称">
      <input class="field-input" [value]="menuName()" (input)="menuName.set($any($event.target).value)" />
    </app-form-field>
    <app-form-field label="描述">
      <input class="field-input" [value]="description()" (input)="description.set($any($event.target).value)" />
    </app-form-field>
    <app-form-field label="Code">
      <input class="field-input" [value]="code()" (input)="code.set($any($event.target).value)" />
    </app-form-field>
    <app-form-field label="上级菜单">
      <app-dropdown-select
        [options]="parentMenuOptions"
        [value]="parentMenu()"
        placeholder="请选择上级菜单"
        (valueChange)="parentMenu.set($event)"
      />
    </app-form-field>
    <app-form-field label="icon">
      <input class="field-input" [value]="icon()" (input)="icon.set($any($event.target).value)" />
    </app-form-field>
    <app-form-field label="类型">
      <div class="type-radios">
        <label class="radio">
          <input type="radio" name="menuType" value="menu" [checked]="menuType() === 'menu'" (change)="menuType.set('menu')" />
          <span>menu type</span>
        </label>
        <label class="radio">
          <input type="radio" name="menuType" value="label" [checked]="menuType() === 'label'" (change)="menuType.set('label')" />
          <span>label</span>
        </label>
        <label class="radio">
          <input type="radio" name="menuType" value="button" [checked]="menuType() === 'button'" (change)="menuType.set('button')" />
          <span>button</span>
        </label>
      </div>
    </app-form-field>
  </div>

  <div class="detail-section">
    <h3 class="detail-section__title">配置</h3>
    <app-form-field label="位置">
      <app-dropdown-select
        [options]="positionOptions"
        [value]="position()"
        placeholder="请选择位置"
        (valueChange)="position.set($event)"
      />
    </app-form-field>
    <app-form-field label="route 路由">
      <input class="field-input" [value]="route()" (input)="route.set($any($event.target).value)" />
    </app-form-field>
  </div>

  <div drawerFooter>
    <app-button label="取消" variant="outline" (clicked)="close()" />
    <app-button label="保存" variant="primary" (clicked)="save()" />
  </div>
</app-drawer>
