<div class="page">
  <app-page-header title="角色管理" desc="角色管理设置权位，通过将权限与岗位或者员工动态关联，超越行政级别，实现灵活的赋能。" [showHelp]="true" />
  <app-split-layout>
    <ng-container left>
      <div class="left-header">
        <app-search-input placeholder="搜索" [fullWidth]="true" />
        <button class="add-btn" (click)="onAddRole()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 2V12M2 7H12" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <app-tree-list
        [items]="treeItems()"
        [activeId]="activeTreeId()"
        (select)="onTreeSelect($event)"
        (contextMenu)="onTreeContextMenu($event)"
      />
    </ng-container>
    <ng-container right>
      <div class="panel-header">
        <span class="panel-title">{{ activeRoleName() }}</span>
        <span class="panel-note">该角色下的成员将自动获得对应的管理权限</span>
      </div>
      @if (isLoading()) {
        <div class="state-loading">加载中...</div>
      } @else {
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="col-check">
                  <input type="checkbox" class="checkbox" [checked]="allSelected()" (change)="toggleSelectAll()" />
                </th>
                <th>姓名</th>
                <th>部门</th>
                <th>工号</th>
                <th>管理范围</th>
              </tr>
            </thead>
            <tbody>
              @for (row of members(); track row.id) {
                <tr>
                  <td class="col-check">
                    <input type="checkbox" class="checkbox" [checked]="isSelected(row.id)" (change)="toggleSelect(row.id)" />
                  </td>
                  <td>
                    <div class="cell-user">
                      <div class="avatar">{{ row.avatar }}</div>
                      <span>{{ row.name }}</span>
                    </div>
                  </td>
                  <td>{{ row.dept }}</td>
                  <td>{{ row.jobNo }}</td>
                  <td>{{ row.scope }}</td>
                </tr>
              }
            </tbody>
          </table>
          <div class="table-footer">总人数 {{ totalCount() }}</div>
        </div>
      }
    </ng-container>
  </app-split-layout>
</div>

<!-- 右键菜单 -->
@if (contextMenuPos()) {
  <div class="context-menu" [style.left.px]="contextMenuPos()!.x" [style.top.px]="contextMenuPos()!.y" (click)="$event.stopPropagation()">
    <div class="context-menu-item" (click)="onEditRole()">编辑角色</div>
    <div class="context-menu-item danger" (click)="onDeleteRole()">删除角色</div>
  </div>
}

<!-- 新建/编辑角色弹窗 -->
<app-modal
  [title]="roleModalTitle()"
  size="sm"
  [visible]="showRoleModal()"
  (closed)="showRoleModal.set(false)"
  (confirmed)="onRoleModalConfirm()"
>
  <div class="modal-form">
    <label class="modal-form-label">角色名称</label>
    <input
      class="modal-form-input"
      type="text"
      placeholder="请输入角色名称"
      [value]="roleFormName()"
      (input)="roleFormName.set($any($event.target).value)"
    />
  </div>
</app-modal>

<!-- 删除确认弹窗 -->
<app-modal
  title="删除确认"
  size="sm"
  [visible]="showDeleteModal()"
  confirmText="确认删除"
  (closed)="showDeleteModal.set(false)"
  (confirmed)="onDeleteConfirmed()"
>
  <p>确定要删除该角色吗？删除后将无法恢复。</p>
</app-modal>
