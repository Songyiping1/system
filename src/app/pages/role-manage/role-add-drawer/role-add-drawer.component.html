@if (visible()) {
  <div class="drawer-overlay" (click)="onClose()">
    <div class="drawer-panel" (click)="$event.stopPropagation()">
      <div class="drawer-header">
        <span class="drawer-close" (click)="onClose()">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
            <path d="M4 4L13 13M13 4L4 13" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
      </div>

      <div class="drawer-title-row">
        <span class="drawer-title">{{ title() }}</span>
      </div>

      <div class="drawer-body">
        <div class="section-title">角色信息</div>

        <div class="form-row">
          <label class="form-label">
            <span class="label-icon">To</span>
            角色名称
          </label>
          <div class="form-input">
            <input
              type="text"
              [value]="name()"
              (input)="name.set($any($event.target).value)"
              placeholder="请输入角色名称"
            />
          </div>
        </div>

        <div class="form-row">
          <label class="form-label">
            <span class="label-icon">To</span>
            描述
          </label>
          <div class="form-input">
            <input
              type="text"
              [value]="description()"
              (input)="description.set($any($event.target).value)"
              placeholder="请输入角色描述"
            />
          </div>
        </div>
      </div>

      <div class="drawer-footer">
        <button class="btn-cancel" (click)="onClose()">取消</button>
        <button class="btn-save" [class.disabled]="!canSave()" [disabled]="!canSave()" (click)="onSave()">保存</button>
      </div>
    </div>
  </div>
}
