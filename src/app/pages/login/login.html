<div class="login-container">
  <!-- 左侧蓝色面板 -->
  <div class="login-left">
    @for (size of decorationSizes; track size) {
      <div class="left-decoration" [style.width.px]="size" [style.height.px]="size"></div>
    }
    <div class="left-content">
      <h1 class="left-title">CSES管理后台</h1>
      <p class="left-subtitle">CSES Admin Panel</p>
    </div>
    <div class="left-illustration">
      <img src="images/login-illustration.png" alt="" />
    </div>
  </div>

  <!-- 右侧登录表单 -->
  <div class="login-right">
    <div class="login-card">
      <h2 class="login-heading">登录</h2>

      <!-- 登录方式切换 -->
      <div class="login-tabs">
        <div
          class="login-tab"
          [class.active]="activeTab() === 'password'"
          (click)="activeTab.set('password')"
        >
          账号密码登录
        </div>
        <div
          class="login-tab"
          [class.active]="activeTab() === 'code'"
          (click)="activeTab.set('code')"
        >
          验证码登录
        </div>
      </div>

      <!-- 表单 -->
      <div class="login-form">
        <div class="form-group">
          <label class="form-label">Email/手机号</label>
          <input
            class="form-input"
            type="text"
            [(ngModel)]="username"
            [class.focused]="usernameFocused()"
            (focus)="usernameFocused.set(true)"
            (blur)="usernameFocused.set(false)"
          />
        </div>

        @if (activeTab() === 'password') {
          <div class="form-group">
            <label class="form-label">密码</label>
            <input
              class="form-input"
              type="password"
              placeholder="请输入密码"
              [(ngModel)]="password"
            />
          </div>
        } @else {
          <div class="form-group">
            <label class="form-label">验证码</label>
            <div class="code-input-group">
              <input
                class="form-input code-input"
                type="text"
                placeholder="请输入验证码"
                [(ngModel)]="verifyCode"
              />
              <button class="send-code-btn" (click)="onSendCode()">发送验证码</button>
            </div>
          </div>
        }

        @if (errorMessage()) {
          <div class="error-message">{{ errorMessage() }}</div>
        }

        <button class="login-btn" (click)="onLogin()">登录</button>


        <div class="forgot-password">
          <a href="javascript:void(0)">忘记密码？</a>
        </div>
      </div>
    </div>
  </div>
</div>
