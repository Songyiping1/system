<div class="page">
  <div class="page-header-row">
    <app-page-header title="集团上下级" desc="开通集团上下级组织架构，实现直效，透明的内部协同与资源共享，提升集团整体运营效率。" [showHelp]="true" />
    <span class="header-quota">已关联 321人/10000人</span>
  </div>
  <app-stats-row [items]="stats" />
  <app-action-bar>
    <app-search-input left placeholder="搜索" (search)="onSearch($event)" />
    <app-button right label="关联下级组织" type="primary" />
  </app-action-bar>
  @if (isLoading()) {
    <div class="state-loading">加载中...</div>
  } @else {
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>组织名称</th>
            <th>人数</th>
            <th>挂接部门</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody>
          @for (row of orgList(); track row.name) {
            <tr>
              <td>
                <div class="cell-org">
                  <div class="org-icon">{{ row.icon }}</div>
                  <span>{{ row.name }}</span>
                </div>
              </td>
              <td>{{ row.count }}</td>
              <td>{{ row.dept }}</td>
              <td>
                <app-status-badge [status]="row.status" />
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
