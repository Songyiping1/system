<div class="group-hierarchy">
  <app-page-header title="集团上下级" description="查看集团上下级组织关系" />

  <app-stats-card-row [cards]="statsCards()" (cardClick)="onStatsCardClick($event)" />

  <app-action-bar>
    <app-search-input actionBarLeft [placeholder]="'搜索组织'" [value]="searchValue()" (valueChange)="searchValue.set($event)" />
    <div actionBarRight class="action-buttons">
      <app-button label="导入" variant="outline" />
      <app-button label="添加组织" variant="primary" />
    </div>
  </app-action-bar>

  <div class="table-wrapper">
    <div class="table-header">
      <div class="table-header__cell table-header__cell--name">
        <span class="table-header__label">公司名称</span>
      </div>
      <div class="table-header__cell">
        <span class="table-header__separator"></span>
        <span class="table-header__label">人数</span>
      </div>
      <div class="table-header__cell">
        <span class="table-header__separator"></span>
        <span class="table-header__label">部门</span>
      </div>
      <div class="table-header__cell">
        <span class="table-header__separator"></span>
        <span class="table-header__label">状态</span>
      </div>
      <div class="table-header__cell table-header__cell--action">
        <span class="table-header__separator"></span>
        <span class="table-header__label">操作</span>
      </div>
    </div>
    <div class="table-body">
      @for (row of flattenedRows(); track row.node.key) {
        <div class="table-row" [class.table-row--highlighted]="row.node.data['highlighted']">
          <div class="table-row__cell table-row__cell--name">
            @for (_ of getIndent(row.level); track $index) {
              <span class="table-row__indent"></span>
            }
            @if (row.node.children?.length) {
              <span class="table-row__chevron" [class.table-row__chevron--expanded]="isExpanded(row.node.key)" (click)="toggleExpand(row.node.key); $event.stopPropagation()">
                <svg width="16" height="16" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" stroke="#999" stroke-width="1.5" fill="none"/></svg>
              </span>
            } @else {
              <span class="table-row__chevron-placeholder"></span>
            }
            <app-company-icon [fallbackText]="row.node.data['name']" [size]="32" [bgColor]="row.node.data['iconColor']" />
            <span class="table-row__label">{{ row.node.data['name'] }}</span>
          </div>
          <div class="table-row__cell">{{ row.node.data['count'] }}</div>
          <div class="table-row__cell">{{ row.node.data['department'] }}</div>
          <div class="table-row__cell">
            <span
              class="status-badge"
              [class.status-badge--normal]="row.node.data['statusType'] === 'normal'"
              [class.status-badge--disabled]="row.node.data['statusType'] === 'disabled'"
              [class.status-badge--cancelled]="row.node.data['statusType'] === 'cancelled'"
            >{{ row.node.data['status'] }}</span>
          </div>
          <div class="table-row__cell table-row__cell--action">
            <a class="table-row__link" href="javascript:void(0)">查看</a>
          </div>
        </div>
      }
    </div>
  </div>
</div>
