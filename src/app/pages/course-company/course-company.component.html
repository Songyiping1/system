<div class="page">
  <app-page-header title="课程公司管理" desc="管理整个CSES中课程公司" />

  <app-action-bar>
    <app-search-input left placeholder="根据企业名称或完整企业标号搜索" (search)="onSearch($event)" />
    <ng-container right>
      <app-button label="删除" type="danger" />
      <app-button label="+ 新建公司" type="primary" />
    </ng-container>
  </app-action-bar>

  @if (isLoading()) {
    <div class="state-loading">加载中...</div>
  } @else {
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-name">
              <div class="th-name-inner">
                <input type="checkbox" class="checkbox" [checked]="allChecked" (change)="toggleAll()" />
                <span>公司名称</span>
              </div>
            </th>
            <th class="col-flex">公司简名</th>
            <th class="col-flex">人数</th>
            <th class="col-flex">管理员手机号</th>
          </tr>
        </thead>
        <tbody>
          @for (row of companies(); track row.id) {
            <tr>
              <td class="col-name">
                <div class="cell-name-inner">
                  <input type="checkbox" class="checkbox" [checked]="row.checked" (click)="$event.stopPropagation()" (change)="toggleCheck(row)" />
                  @if (row.hasChildren) {
                    <div class="expand-btn" [class.expanded]="row.expanded" (click)="toggleExpand(row, $event)">
                      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M6 4L10 8L6 12" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </div>
                  }
                  <div class="company-icon" [style.background]="row.iconColor">{{ row.icon }}</div>
                  <span class="company-name">{{ row.name }}</span>
                </div>
              </td>
              <td class="col-flex">{{ row.shortName }}</td>
              <td class="col-flex">{{ row.count }}</td>
              <td class="col-flex">{{ row.phone }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
