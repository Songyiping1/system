<div class="admin-assign">
  <div class="admin-assign__body">
    <div class="admin-assign__left">
      <div class="search-row">
        <app-search-input [placeholder]="'搜索'" [value]="searchValue()" (valueChange)="searchValue.set($event)" />
        <button class="add-btn" type="button">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="collapse-btn" type="button" (click)="toggleCollapseAll()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 4h10M2 7h10M2 10h10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <app-person-tree
        [nodes]="personNodes()"
        [selectedKeys]="selectedPersonKeys()"
        [maxSelect]="1"
        (selectionChange)="onPersonSelectionChange($event)"
      />
    </div>
    <div class="admin-assign__right">
      <div class="assign-header">
        <div class="assign-header__info">
          <h3>分配中 - {{ selectedPersonLabel() }}</h3>
          <span class="assign-header__time">上次更新时间: 2025-12-01 14:14</span>
        </div>
        <div class="assign-header__actions">
          <app-button label="取消" variant="outline" />
          <app-button label="保存" variant="primary" />
        </div>
      </div>
      <app-data-table [columns]="assignColumns()" [selectable]="true" [selectAll]="false">
        @for (row of assignRows(); track row.key) {
          <div class="table-row" [class.table-row--checked]="row.checked" [class.table-row--disabled]="row.disabled">
            <div class="table-row__cell table-row__cell--checkbox">
              <app-checkbox [checked]="row.checked" [disabled]="row.disabled" />
            </div>
            <div class="table-row__cell table-row__cell--name" style="flex:1">
              <span>{{ row.name }}</span>
            </div>
            <div class="table-row__cell" style="flex:1">{{ row.purchaseDate }}</div>
            <div class="table-row__cell" style="flex:1">{{ row.duration }}</div>
            <div class="table-row__cell" style="flex:1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ row.description }}</div>
          </div>
        }
      </app-data-table>
    </div>
  </div>
</div>
