<div class="application-list">
  <app-page-header title="入驻申请列表" description="查看全部菜单，管理与编辑菜单配置" />
  <app-action-bar>
    <div actionBarLeft class="filter-bar">
      <app-search-input [placeholder]="'搜索'" [value]="searchValue()" (valueChange)="searchValue.set($event)" />
      <app-status-filter
        label="审批状态"
        [options]="filterOptions()"
        [value]="statusFilter()"
        (valueChange)="statusFilter.set($event)"
      />
    </div>
    @if (showBatchActions()) {
      <div actionBarRight class="action-buttons">
        <app-button label="拒绝" variant="outline-danger" (clicked)="openRejectDialog()" />
        <app-button label="通过" variant="outline" />
      </div>
    }
  </app-action-bar>
  <div class="table-wrapper">
    <div class="table-header">
      <div class="table-header__cell table-header__cell--name">
        <app-checkbox [checked]="selectAll()" [indeterminate]="indeterminate()" (checkedChange)="toggleSelectAll()" />
        <span class="table-header__label">公司名称</span>
      </div>
      <div class="table-header__cell">
        <span class="table-header__separator"></span>
        <span class="table-header__label">审批状态</span>
      </div>
      <div class="table-header__cell">
        <span class="table-header__separator"></span>
        <span class="table-header__label">公司别名</span>
      </div>
      <div class="table-header__cell">
        <span class="table-header__separator"></span>
        <span class="table-header__label">申请时间</span>
      </div>
      <div class="table-header__cell">
        <span class="table-header__separator"></span>
        <span class="table-header__label">审批时间</span>
      </div>
      <div class="table-header__cell">
        <span class="table-header__separator"></span>
        <span class="table-header__label">管理员手机号</span>
      </div>
    </div>
    <div class="table-body">
      @for (row of rows(); track row.key) {
        <div class="table-row">
          <div class="table-row__cell table-row__cell--name">
            <app-checkbox [checked]="isSelected(row.key)" [disabled]="isRowDisabled(row)" (checkedChange)="toggleRow(row.key)" />
            <app-company-icon [fallbackText]="row.name" [size]="32" [bgColor]="row.iconColor" />
            <span class="table-row__label">{{ row.name }}</span>
          </div>
          <div class="table-row__cell">
            <app-type-badge [label]="row.status" [variant]="row.statusVariant" />
          </div>
          <div class="table-row__cell">{{ row.shortName }}</div>
          <div class="table-row__cell">{{ row.applyTime }}</div>
          <div class="table-row__cell">{{ row.approveTime }}</div>
          <div class="table-row__cell">{{ row.phone }}</div>
        </div>
      }
    </div>
  </div>
</div>

<app-dialog
  [visible]="rejectDialogVisible()"
  title="拒绝理由"
  width="584px"
  [headerBorder]="true"
  (visibleChange)="rejectDialogVisible.set($event)"
  (closed)="closeRejectDialog()"
>
  <div class="reject-dialog-body">
    <p class="reject-dialog-body__desc">拒绝理由将以短信形式发送至对方管理员手机上</p>
    <input
      class="reject-dialog-body__input"
      type="text"
      placeholder="您好，当前资质不符，请联系邀请人确认（选填）"
      [ngModel]="rejectReason()"
      (ngModelChange)="rejectReason.set($event)"
    />
    <div class="reject-dialog-body__actions">
      <app-button label="取消" variant="outline" (clicked)="closeRejectDialog()" />
      <app-button label="拒绝" variant="danger" (clicked)="confirmReject()" />
    </div>
  </div>
</app-dialog>
