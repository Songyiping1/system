<div class="page">
  <app-page-header title="公司资源管理" desc="查看全部菜单，管理与编辑菜单配置" />

  <app-action-bar>
    <ng-container left>
      <app-search-input placeholder="搜索" (search)="onSearch($event)" />
      <app-filter-select label="审批状态：" [options]="statusOptions" (change)="onStatusFilter($event)" />
    </ng-container>
  </app-action-bar>

  @if (isLoading()) {
    <div class="state-loading">加载中...</div>
  } @else {
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-name">
              <div class="th-name-inner">
                <input type="checkbox" class="checkbox" [checked]="allChecked" (change)="toggleAll()" />
                <span>公司名称</span>
              </div>
            </th>
            <th class="col-flex">审批状态</th>
            <th class="col-flex">公司简名</th>
            <th class="col-flex">申请时间</th>
            <th class="col-flex">审批时间</th>
            <th class="col-flex">管理员手机号</th>
          </tr>
        </thead>
        <tbody>
          @for (row of rows(); track row.id) {
            <tr>
              <td class="col-name">
                <div class="cell-name-inner">
                  <input type="checkbox" class="checkbox" [checked]="row.checked" (change)="toggleCheck(row)" />
                  <div class="company-icon" [style.background]="row.iconColor">{{ row.icon }}</div>
                  <span class="company-name">{{ row.name }}</span>
                </div>
              </td>
              <td class="col-flex">
                <app-status-badge [status]="row.status" />
              </td>
              <td class="col-flex">{{ row.shortName }}</td>
              <td class="col-flex">{{ row.applyTime }}</td>
              <td class="col-flex">{{ row.approveTime }}</td>
              <td class="col-flex">{{ row.phone }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>

<!-- 拒绝理由弹窗 -->
<app-modal
  title="拒绝理由"
  size="sm"
  [radius]="16"
  [visible]="rejectVisible()"
  [showFooter]="false"
  (closed)="closeReject()"
>
  <div class="reject-body">
    <p class="reject-hint">拒绝理由将以短信形式发送至对方管理员手机上</p>
    <input
      class="reject-input"
      type="text"
      placeholder="您好，当前资质不符，请联系邀请人确认（选填）"
      [ngModel]="rejectReason()"
      (ngModelChange)="rejectReason.set($event)"
    />
    <div class="reject-actions">
      <button class="reject-btn-cancel" (click)="closeReject()">取消</button>
      <button class="reject-btn-confirm" (click)="confirmReject()">拒绝</button>
    </div>
  </div>
</app-modal>
